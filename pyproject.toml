[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
required-version = ">=0.8.17"

[project]
name = "cisco-ai-mcp-scanner"
version = "4.8.8"
description = "A tool to scan MCP servers and tools for security findings"
authors = [
    {name = "Cisco"},
]
readme = "README.md"
requires-python = ">=3.11.4"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers"
]
# Abstract dependency constraints for downstream consumers (for example
# DefenseClaw, which installs this package next to skill-scanner). Use floor
# pins plus next-major ceilings, never exact pins. Reproducibility for our own
# CI comes from the committed uv.lock; the scanner's Docker images install
# mcpscanner/docker/requirements.lock.txt, its hash-pinned export.
dependencies = [
    # 1.30.0 is the first 1.x release without GHSA-84m7-p3x7-pcfv,
    # PYSEC-2026-3481/3482/3483 and GHSA-hvrp-rf83-w775, GHSA-jpw9-pfvf-9f58,
    # GHSA-vj7q-gjh5-988w. 2.0.0 through 2.1.1 still carry GHSA-84m7-p3x7-pcfv.
    # SDK 1.x stays supported so consumers on mcp<2 can install this package.
    "mcp[cli]>=1.30.0,<3,!=2.0.*,!=2.1.*",
    "httpx>=0.28.1,<1",
    "yara-python>=4.5.4,<5",
    "fastapi>=0.125.0,<1",
    "uvicorn>=0.29.0,<1",
    "pydantic>=2.6.0,<3",
    "python-dotenv>=1.0.0,<2",
    # CVE-2026-84377 (GHSA-3cv6-jpf6-8222) is fixed in 1.91.5, 1.92.2,
    # 1.93.2, 1.94.3, 1.95.1 and 1.96.2; exclude the affected releases on the
    # later lines, including 1.96.1, which is in the advisory range but not
    # currently on PyPI. Exclude 1.107.0: hijacked PyPI wheels with a .pth
    # credential stealer (BerriAI/litellm#47826).
    "litellm>=1.91.5,<2,!=1.92.0,!=1.92.1,!=1.93.0,!=1.93.1,!=1.94.0,!=1.94.1,!=1.94.2,!=1.95.0,!=1.96.0,!=1.96.1,!=1.107.0",
    "expandvars>=0.12.0,<2",
    # JS/TS parsing for npm behavioral analysis pins the shared tree-sitter
    # runtime to a tested ABI range (other language packs stay >=0.21.0,
    # which the <0.26 ceiling still satisfies).
    "tree-sitter>=0.23,<0.26",
    "tree-sitter-python>=0.21.0,<1",
    "tree-sitter-javascript>=0.23,<0.26",
    "tree-sitter-typescript>=0.23,<0.26",
    "tree-sitter-go>=0.21.0,<1",
    "tree-sitter-java>=0.21.0,<1",
    "tree-sitter-kotlin>=0.21.0,<2",
    "tree-sitter-c-sharp>=0.21.0,<1",
    "tree-sitter-ruby>=0.21.0,<1",
    "tree-sitter-rust>=0.21.0,<1",
    "tree-sitter-php>=0.21.0,<1",
    "puremagic>=1.28,<3",
    "pip-audit>=2.7.0,<3",
]

[project.optional-dependencies]
js = [
    "tree-sitter>=0.23,<0.26",
    "tree-sitter-javascript>=0.23,<0.26",
    "tree-sitter-typescript>=0.23,<0.26",
]
go = [
    "tree-sitter>=0.21.0,<0.26",
    "tree-sitter-go>=0.21.0,<1",
]
java = [
    "tree-sitter>=0.21.0,<0.26",
    "tree-sitter-java>=0.21.0,<1",
]
kotlin = [
    "tree-sitter>=0.21.0,<0.26",
    "tree-sitter-kotlin>=0.21.0,<2",
]
csharp = [
    "tree-sitter>=0.21.0,<0.26",
    "tree-sitter-c-sharp>=0.21.0,<1",
]
ruby = [
    "tree-sitter>=0.21.0,<0.26",
    "tree-sitter-ruby>=0.21.0,<1",
]
rust = [
    "tree-sitter>=0.21.0,<0.26",
    "tree-sitter-rust>=0.21.0,<1",
]
php = [
    "tree-sitter>=0.21.0,<0.26",
    "tree-sitter-php>=0.21.0,<1",
]
all-languages = [
    "tree-sitter>=0.23,<0.26",
    "tree-sitter-javascript>=0.23,<0.26",
    "tree-sitter-typescript>=0.23,<0.26",
    "tree-sitter-go>=0.21.0,<1",
    "tree-sitter-java>=0.21.0,<1",
    "tree-sitter-kotlin>=0.21.0,<2",
    "tree-sitter-c-sharp>=0.21.0,<1",
    "tree-sitter-ruby>=0.21.0,<1",
    "tree-sitter-rust>=0.21.0,<1",
    "tree-sitter-php>=0.21.0,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.2.1",
    "respx>=0.22.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "isort>=5.13.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[project.urls]
Homepage = "https://github.com/cisco-ai-defense/mcp-scanner"
Repository = "https://github.com/cisco-ai-defense/mcp-scanner"
Documentation = "https://github.com/cisco-ai-defense/mcp-scanner#readme"
Issues = "https://github.com/cisco-ai-defense/mcp-scanner/issues"

[project.scripts]
mcp-scanner = "mcpscanner.cli:cli_entry_point"
mcp-scanner-api = "mcpscanner.server:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--maxfail=1"
filterwarnings = [
    # Silence Pydantic deprecation/future warnings across all tests
    #"ignore::DeprecationWarning:pydantic.*",
    #"ignore::FutureWarning:pydantic.*",
    # Silence noisy Pydantic serializer warnings emitted by OpenAI/LiteLLM models
    "ignore:Pydantic serializer warnings:UserWarning:pydantic.*",
    # Fallback by message for environments where the category path differs
    #"ignore:Pydantic V1 style.*:DeprecationWarning",
    #"ignore:.*Pydantic.*deprecated.*:DeprecationWarning",
]
markers = [
    "integration: mark for tests that hit external services (run with -m integration)",
]

[tool.setuptools.packages.find]
include = ["mcpscanner*"]
exclude = ["examples*", "evals*"]

[tool.setuptools.package-data]
"mcpscanner" = ["data/prompts/*.md", "data/yara_rules/*.yara", "data/yara_rules/*.yar"]
"mcpscanner.docker" = [
    "Dockerfile",
    "Dockerfile.wheel",
    "Dockerfile.npm",
    "Dockerfile.npm.wheel",
    "entrypoint.py",
    "entrypoint_npm.py",
    "requirements.lock.txt",
]

# Code formatting and linting configuration
[tool.black]
line-length = 88
target-version = ['py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
# A regex preceded by ^/ will apply only to files and directories
# in the root of the project.
^/setup.py
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503", "E501"]
exclude = [".git", "__pycache__", "build", "dist", ".venv", "venv"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "yara",
    "litellm",
    "mcp.*",
]
ignore_missing_imports = true
