name: Run Unit Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install the latest version of uv and set the Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Check the Docker requirements lock matches uv.lock
        if: matrix.python-version == '3.13'
        run: |
          uv export --frozen --no-dev --no-emit-project --output-file mcpscanner/docker/requirements.lock.txt
          git diff --exit-code -- mcpscanner/docker/requirements.lock.txt

      - name: Run tests
        run: uv run --locked pytest

  test-lowest:
    # Downstream consumers install this package next to their own pins, so the
    # dependency floors in pyproject.toml must work on both MCP SDK lines.
    name: test (lowest dependency versions, MCP SDK ${{ matrix.mcp-line }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mcp-line: "1.x"
            extra-requirement: ""
            expected-mcp: "1.30.0"
            expected-litellm: "1.91.5"
          - mcp-line: "2.x"
            extra-requirement: "mcp[cli]>=2.2,<3"
            expected-mcp: "2.2.0"
            expected-litellm: "1.91.5"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install the latest version of uv and set Python 3.11
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Install the package at its lowest allowed versions
        # Only runtime dependencies resolve to their floors; the dev group's
        # lowest versions pull in unrelated packages that shadow tests/.
        env:
          EXTRA_REQUIREMENT: ${{ matrix.extra-requirement }}
        run: |
          uv venv
          uv pip install --resolution lowest-direct -e . ${EXTRA_REQUIREMENT:+"$EXTRA_REQUIREMENT"}
          uv pip install pytest pytest-asyncio pytest-cov respx
          uv pip check

      - name: Check the expected dependency floors are installed
        env:
          EXPECTED_MCP: ${{ matrix.expected-mcp }}
          EXPECTED_LITELLM: ${{ matrix.expected-litellm }}
        run: |
          .venv/bin/python - <<'EOF'
          import importlib.metadata as m
          import os
          for pkg in ("mcp", "litellm", "fastapi", "httpx", "pydantic"):
              print(f"{pkg}=={m.version(pkg)}")
          assert m.version("mcp") == os.environ["EXPECTED_MCP"], "unexpected MCP SDK floor"
          assert m.version("litellm") == os.environ["EXPECTED_LITELLM"], "unexpected LiteLLM floor"
          EOF

      - name: Run tests
        run: .venv/bin/python -m pytest

  test-latest:
    # A fresh install without uv.lock picks the newest versions pyproject.toml
    # allows; this is what downstream consumers get.
    name: test (latest allowed dependency versions)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install the latest version of uv and set Python 3.13
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install the package at its newest allowed versions
        run: |
          uv venv
          uv pip install -e . pytest pytest-asyncio pytest-cov respx
          uv pip check
          uv pip list | grep -Ei '^(mcp|litellm|fastapi|starlette|pydantic) '

      - name: Run tests
        run: .venv/bin/python -m pytest
