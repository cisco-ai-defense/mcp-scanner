# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]             # runs on PRs, including from forks
  merge_group:
  schedule:
    - cron: '44 2 * * 2'             # weekly scheduled scan

# Minimal permissions for CodeQL to work safely across push/PR/fork events.
permissions:
  contents: read                     # allow checkout of repo content
  actions: read                      # required for workflows in private repos
  security-events: write             # required to upload SARIF results

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Runner size impacts CodeQL analysis time. To learn more, please see:
    #   - https://gh.io/recommended-hardware-resources-for-running-codeql
    #   - https://gh.io/supported-runners-and-hardware-resources
    #   - https://gh.io/using-larger-runners (GitHub.com only)
    # Consider using larger runners or machines with greater resources for possible analysis time improvements.
    runs-on: 'ubuntu-latest'

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
          # CodeQL supports the following values for 'language':
          #   'actions', 'c-cpp', 'csharp', 'go', 'java-kotlin',
          #   'javascript-typescript', 'python', 'ruby', 'rust', 'swift'
          #
          # Use `c-cpp` to analyze code written in C, C++ or both
          # Use 'java-kotlin' to analyze code written in Java, Kotlin or both
          # Use 'javascript-typescript' to analyze code written in JavaScript, TypeScript or both
          #
          # To learn more about changing the languages that are analyzed or customizing
          # the build mode for your analysis, see:
          #   https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning
          #
          # If you are analyzing a compiled language, you can modify the 'build-mode'
          # to customize how your codebase is built for analysis. See:
          #   https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/codeql-code-scanning-for-compiled-languages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # No explicit `ref:` needed: for pull_request (including forks), this
        # already checks out the PR's merge commit by default. Using
        # pull_request_target with a fork's head.sha here previously made
        # actions/checkout refuse the checkout (a "pwn request" guard), since
        # pull_request_target runs with the base repo's trusted token.
        with:
          persist-credentials: false  # Don't persist auth tokens

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # If you wish to specify custom queries, you can do so here or in a config file.
          # By default, queries listed here will override any specified in a config file.
          # Prefix the list here with "+" to use these queries and those in the config file.
          #
          # For more details on CodeQL's query packs, refer to:
          # https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
          #
          # Example:
          # queries: security-extended,security-and-quality

      # For compiled languages, CodeQL tries to build automatically.
      - name: Autobuild
        if: ${{ matrix.build-mode != 'manual' }}
        uses: github/codeql-action/autobuild@v3

      # If the analyze step fails for one of the languages you are analyzing with
      # "We were unable to automatically build your code", modify the matrix above
      # to set the build mode to "manual" for that language. Then add build steps here.
      # Example (replace with real build commands for your project):
      # - if: matrix.build-mode == 'manual'
      #   run: |
      #     make bootstrap
      #     make release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
